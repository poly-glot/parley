post_types:
  enquiry:
    icon: dashicons-email
    label: Enquiries
    public: false
    show_ui: true
    singular: Enquiry
    supports: [title]

field_groups:
  enquiry_details:
    post_types: [enquiry]
    title: Enquiry
    fields:
      name:
        label: Name
        type: text
        width: 50
      organisation:
        label: Organisation
        type: text
        width: 50
      email:
        column: true
        label: Email
        type: email
        width: 50
      phone:
        label: Phone
        type: text
        width: 50
      topic:
        choices: [Media relations, Digital & social, Crisis & reputation, Issues advocacy, Podcasts & audio, Film & explainers, Design & development, Not sure yet]
        column: true
        label: Topic
        type: select
      referral:
        choices: [A law firm, Another agency, A client, Search, Press, Other]
        label: Referral
        type: select
      message:
        label: Message
        rows: 6
        searchable: true
        type: textarea
      consent:
        label: Consent given
        type: true_false
